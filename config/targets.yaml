# iostrend 抓取目标配置
# 改这里即可增删市场 / 榜单 / 关注品类，无需改任何代码。

# 市场：ISO 3166-1 alpha-2 国家码（Apple storefront）
# 出海核心市场为主，可自由增删（如 fr ca au br id tw hk ...）
markets:
  - us   # 美国
  - jp   # 日本
  - kr   # 韩国
  - gb   # 英国
  - de   # 德国

# 榜单类型：免费官方源仅支持这两类（没有畅销榜 top-grossing）
feeds:
  - top-free
  - top-paid

# 每榜抓取条数，Apple 官方上限为 100
limit: 100

# 重点关注品类（App Store genreId）——用于报告高亮与看板筛选
watch_genres:
  game: "6014"      # 游戏（大类）
  puzzle: "7012"    # 解谜
  word: "7019"      # 文字（与 arrowdoodle 相邻品类）

# 报告/看板的「专题」聚焦品类，直接服务自家 app 开发
focus_genre_id: "7012"
focus_label: "解谜游戏"

# === M2 分品类深榜 ===
# 旧版 iTunes genre RSS（Apple 公开端点，legacy 但仍可用；可能变动，故作可插拔补充源）。
# 补足总榜拿不到的细分品类榜，含畅销榜(topgrossing，新版免费源没有)。
category_charts:
  enabled: true
  feeds: [topfree, toppaid, topgrossing]
  limit: 100        # 旧版 genre RSS 的上限（再高会被截断到 100）
  genres:            # 显示名: App Store genreId
    解谜: "7012"
    游戏: "6014"
    文字: "7019"
  focus: "解谜"       # 看板默认展示的分品类

# === M3 竞品/自家雷达 ===
# 关注列表：跨所有市场×所有榜单(总榜+分品类)聚合追踪。
# 每项：字符串=名称包含匹配(大小写不敏感)；纯数字=app_id 精确匹配。
watchlist:
  enabled: false     # 竞品雷达暂时关闭（作用不大）；改回 true 即恢复
  apps:
    - "Arrows"        # Arrows – Puzzle Escape（同类：曲线箭头逃脱）
    - "Block Blast"
    - "Meowdoku"
    - "Royal Match"   # 解谜畅销榜常青
    - "Candy Crush"
    # arrowdoodle 上线后：加 "Arrowdoodle" 或其 app_id
